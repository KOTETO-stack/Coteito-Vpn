name: Auto Update VPN
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python fetcher.py
      - run: python tester.py
      - run: python generator.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add subscription.json tested_nodes.json raw_nodes.json geo_cache.json
          git diff --cached --quiet || git commit -m "auto: update $(date -u +%Y-%m-%d-%H:%M)"
          git push
